
map cmd+k send_text terminal,application \x63\x6C\x65\x61\x72\x0A


font_family                Fira Code

background_opacity         0.9
background_blur            20
dynamic_background_opacity yes
font_size 13.0

window_padding_width 4

# Keep the macOS title bar (close / fullscreen buttons), tinted to match the background
hide_window_decorations no
macos_titlebar_color    background

cursor_trail 5

scrollback_lines 10000

url_color #7FB4CA

tab_bar_edge           bottom
tab_bar_style          powerline
tab_powerline_style    round
tab_bar_min_tabs       2
tab_activity_symbol    none
bell_on_tab            no
tab_title_template     "{index} {title[:30]}"
active_tab_font_style  bold

macos_option_as_alt both

# ============================================
# Theme
# ============================================
# current-theme.conf is generated from theme/colors.sh — run `make theme`

# BEGIN_KITTY_THEME
include current-theme.conf
# END_KITTY_THEME
